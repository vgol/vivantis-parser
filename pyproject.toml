[project]
name = "vivantis-parser"
version = "0.1.0"
description = "Vivantis B2B supplier parser"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "ipykernel>=6.29.5",
  "pandas>=2.2.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.7.0",
  "ty>=0.0.1a14",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
